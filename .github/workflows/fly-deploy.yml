# Setiap ada push ke branch main, aplikasi otomatis dipasang ulang di Fly.io.
# Butuh rahasia FLY_API_TOKEN di GitHub (Settings > Secrets and variables > Actions).
name: Deploy ke Fly.io
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
